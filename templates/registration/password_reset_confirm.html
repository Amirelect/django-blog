{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Enter new password{% endblock %}

{% block content %}

    <div class="container">
        <div class="col-6 mb-5">
            <h1>Set a new password</h1>
            <form method="post">
                {% csrf_token %}
                {{ form | crispy }}
                <input type="submit" class="btn btn-success mt-4" value="Change my Password">
            </form>
        </div>
    </div>
    
{% endblock %}
