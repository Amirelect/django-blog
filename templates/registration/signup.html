{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
    
    <div class="container">
        <div class="col-6">
            <h2>Sign Up Form</h2>
            <form method="post" class="mb-5">
                {% csrf_token %}
                {{ form | crispy }}
                <button class="btn btn-success mt-3" type="submit">Sign Up</button>
            </form>
        </div>
    </div>

{% endblock %}
