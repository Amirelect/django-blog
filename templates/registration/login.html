{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}

    <div class="container">
        <div class="col-6">
            <h2>Login Form</h2>
            <form method="post" class="mb-4">
                {% csrf_token %}
                {{ form | crispy }}
                <button class="btn btn-primary mt-3" type="submit">Login</button>
            </form>
            <p class="mb-4"><a href="{% url 'password_reset' %}">Forgot my password</a></p>
        </div>
    </div>
    
{% endblock %}
